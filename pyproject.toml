[project]
name = "questions-academy-dataset-opentriviaqa"
version = "0.0.1"
description = "A Creative Commons dataset of trivia questions and answers"

[tool.pytest]
addopts = [
    "-vv",
    "--capture", "no",
    "--show-capture", "all",
    "-m", "not quality",
    #   --exitfirst                 Stop the test execution at the first failed unit test.
    #                               https://docs.pytest.org/en/6.2.x/usage.html#stopping-after-the-first-or-n-failures
    "--exitfirst",
]
